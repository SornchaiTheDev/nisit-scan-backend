version: "3.8"
services:
  app:
    build:
      dockerfile: ./docker/Dockerfile
      context: ../
    ports:
      - 9000:9000
    env_file:
      - ../.env
    restart: always
    depends_on:
      db:
        condition: service_healthy
        restart: true
  db:
    image: postgres:latest
    restart: unless-stopped
    volumes:
      - nisits-scan:/var/lib/postgresql/data
    ports:
      - 5433:5432
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
volumes:
  nisits-scan:
